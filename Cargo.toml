[package]
name = "mp14tools"
version = "0.2.7"
edition = "2021"
description = "MP14Tools - lightweight touchpad deep-press and OEM key remapper"

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["glow", "default_fonts"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ttf-parser = "0.25.1"
# One feature per API group actually used - keeping the list explicit is what
# keeps the release binary at a few megabytes.
windows = { version = "0.62.2", features = [
    "Win32_Devices_Display",              # QueryDisplayConfig / HDR (advanced colour)
    "Win32_Devices_HumanInterfaceDevice", # HidD_SetOutputReport (haptic strength)
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",                 # EnumDisplaySettings / ChangeDisplaySettingsEx
    "Win32_Security",
    "Win32_Storage_FileSystem",           # CreateFileW on the HID collection
    "Win32_System_Com",
    "Win32_System_Console",               # optional console window
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Power",                 # GetSystemPowerStatus (AC vs battery)
    "Win32_System_Registry",
    "Win32_System_Rpc",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_Wmi",
    "Win32_UI",                           # PBT_APM* power broadcast codes
    "Win32_UI_HiDpi",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",              # ITEMIDLIST for the folder picker
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
